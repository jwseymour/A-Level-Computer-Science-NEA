description: "30-minute mobility routine:\n\n1. Shoulder Mobility (8 mins):\n- Wall slides: 2x10\n- Band dislocates: 2x10\n- Shoulder circles: 2x20\n\n2. Hip Mobility (8 mins):\n- World's greatest stretch: 5/side\n- Pigeon pose: 1min/side\n- Hip circles: 2x10/side\n\n3. Ankle/Wrist Mobility (8 mins):\n- Wrist circles: 2x20\n- Ankle mobility: 2x10/side\n\n4. Spine Mobility (6 mins):\n- Cat-cow: 10 reps\n- Thoracic extensions: 2x10\n- Side bends: 1min/side"
