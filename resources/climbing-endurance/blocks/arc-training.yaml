title: "ARC Training Session"
description: "Warm-up: 10min easy climbing\n\nMain Session:\n- 2-3 sets of 20-30min continuous climbing\n- Stay at 30-40% of max grade\n- Focus on smooth, controlled movements\n- Maintain slight pump without increasing\n- Rest 10min between sets\n\nTechnique Focus:\n- Silent feet placement\n- Straight arms when resting\n- Breathing rhythm\n- Efficient path finding\n\nCool-down:\n- 10min easy traversing\n- Light stretching"
