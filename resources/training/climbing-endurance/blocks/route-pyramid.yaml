id: route-pyramid
title: "Route Pyramid Session"
description: "Warm-up:\n- 15min easy climbing\n- Progressive difficulty increase\n\nMain Session:\n- Start 3 grades below project level\n- Pyramid Structure (example):\n  1. 5.10a x3 routes\n  2. 5.10c x2 routes\n  3. 5.11a x2 routes\n  4. 5.11c x1 route (peak)\n  5. 5.11a x1 route\n  6. 5.10c x1 route\n  7. 5.10a x1 route\n\nRest Periods:\n- 5-10min between routes\n- Focus on complete recovery\n- Practice breathing techniques\n\nTechnique Focus:\n- Perfect form throughout\n- Efficient clipping positions\n- Strategic resting\n- Route reading\n\nCool-down:\n- 10min easy climbing\n- Light stretching"
