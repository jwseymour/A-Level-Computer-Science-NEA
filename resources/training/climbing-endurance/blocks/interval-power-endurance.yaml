id: interval-power-endurance
title: "Interval Power Endurance"
description: "Warm-up:\n- 15min easy climbing\n- Progressive difficulty increase\n\nMain Session:\n- 4 sets of 4 minutes on, 4 minutes off\n- Choose routes at 70-80% of max grade\n- Aim for 12-15 moves per sequence\n- Complete 2-3 sequences per interval\n\nInterval Structure:\n- 1min: Moderate climbing\n- 2min: Hard sequences\n- 1min: Moderate climbing\n\nRest Periods:\n- Light traversing\n- Shake out arms\n- Control breathing\n\nCool-down:\n- 10min easy climbing\n- Forearm stretches"
