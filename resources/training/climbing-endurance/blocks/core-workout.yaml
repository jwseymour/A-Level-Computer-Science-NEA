title: "Climber's Core Workout"
description: "30-minute core session:\n\n1. Dynamic Warm-up (5 mins):\n- Bird dogs: 2x10/side\n- Dead bugs: 2x10/side\n\n2. Main Circuit (20 mins):\n- Front levers: 3x max holds\n- Side planks with hip dips: 2x10/side\n- Hollow body holds: 3x30s\n- Dragon flags: 3x5\n\n3. Cool-down (5 mins):\n- Cat-cow stretches\n- Child's pose\n\nRest 30s between exercises\nScale exercises as needed"
